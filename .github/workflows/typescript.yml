name: typescript
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: clients/typescript
      - run: npm test
        working-directory: clients/typescript